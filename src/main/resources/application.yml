spring:
  application:
    name: tilehelper

  datasource:
    url: jdbc:mysql://localhost:3306/tileassistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  file:
    upload-path: D:/tile-images/

jwt:
  secret: tilehelper-jwt-secret-key-2026-this-is-a-very-long-secret-key-for-hs256
  expiration-ms: 86400000